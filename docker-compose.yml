version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: dental_postgres  # 👈 CAMBIADO
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: dental_db  # 👈 CAMBIADO
    ports:
      - "5433:5432"  # 👈 CAMBIADO (puerto externo 5433)
    volumes:
      - dental_postgres_data:/var/lib/postgresql/data  # 👈 CAMBIADO
    restart: always

  redis:
    image: redis:7-alpine
    container_name: dental_redis  # 👈 CAMBIADO
    ports:
      - "6380:6379"  # 👈 CAMBIADO (puerto externo 6380)
    volumes:
      - dental_redis_data:/data  # 👈 CAMBIADO
    restart: always

  backend:
    build: ./backend
    container_name: dental_backend  # 👈 CAMBIADO
    ports:
      - "8001:8000"  # 👈 CAMBIADO (puerto externo 8001)
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/dental_db  # 👈 CAMBIADO (nombre DB)
      REDIS_URL: redis://redis:6379/0  # El interno no cambia
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  dental_postgres_data:  # 👈 CAMBIADO
  dental_redis_data:      # 👈 CAMBIADO